<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" font-family="'JetBrains Mono','Courier New',monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#050a16"/>
      <stop offset="1" stop-color="#02040c"/>
    </linearGradient>
    <radialGradient id="neb" cx="0.15" cy="0" r="0.9">
      <stop offset="0" stop-color="#2fd8ff" stop-opacity="0.14"/>
      <stop offset="0.6" stop-color="#2fd8ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12243f" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#070f22" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="clip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#19e3c2" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#11a9e6" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#25405f"/>
      <stop offset="1" stop-color="#101b30"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="720" fill="url(#bg)"/>
  <rect width="1200" height="720" fill="url(#neb)"/>

  <!-- topbar -->
  <rect x="0" y="0" width="1200" height="54" fill="#0a1322" fill-opacity="0.8"/>
  <line x1="0" y1="54" x2="1200" y2="54" stroke="#2fd8ff" stroke-opacity="0.28"/>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#ffffff">🎬 VIDEO MONTAGE</text>
  <text x="215" y="33" font-size="11" fill="#8aecff" opacity="0.8">/ HOLOGRAPHIC EDITOR</text>
  <g font-size="12" fill="#bcd2ec">
    <rect x="672" y="15" width="78" height="26" fill="none" stroke="#283448"/><text x="686" y="32">+ video</text>
    <rect x="758" y="15" width="78" height="26" fill="none" stroke="#283448"/><text x="772" y="32">+ audio</text>
    <rect x="844" y="15" width="82" height="26" fill="none" stroke="#2fd8ff"/><text x="857" y="32" fill="#2fd8ff">⛶ Crop</text>
    <rect x="934" y="15" width="104" height="26" fill="none" stroke="#283448"/><text x="947" y="32">✂ Cut</text>
    <rect x="1046" y="15" width="130" height="26" fill="#e8f0ff"/><text x="1064" y="32" fill="#05070c" font-weight="700">Export mp4</text>
  </g>

  <!-- video preview (large area) -->
  <g>
    <rect x="352" y="86" width="496" height="300" fill="url(#panel)" stroke="#78d2ff" stroke-opacity="0.25"/>
    <rect x="358" y="92" width="484" height="288" fill="#05080f"/>
    <!-- cyan corner brackets -->
    <g stroke="#2fd8ff" stroke-width="2.5" fill="none">
      <path d="M352 100 L352 86 L366 86"/>
      <path d="M834 86 L848 86 L848 100"/>
      <path d="M352 372 L352 386 L366 386"/>
      <path d="M834 386 L848 386 L848 372"/>
    </g>
    <line x1="374" y1="86" x2="826" y2="86" stroke="#5fdeff" stroke-opacity="0.55"/>
    <!-- play button -->
    <circle cx="600" cy="236" r="34" fill="#2fd8ff" fill-opacity="0.12" stroke="#2fd8ff" stroke-opacity="0.7"/>
    <path d="M590 220 L616 236 L590 252 Z" fill="#8aecff"/>
    <!-- meta chip -->
    <rect x="372" y="104" width="188" height="38" fill="#060c1a" fill-opacity="0.75" stroke="#78d2ff" stroke-opacity="0.25"/>
    <text x="384" y="120" font-size="12" fill="#ffffff" font-weight="600">clip.mp4</text>
    <text x="384" y="134" font-size="10.5" fill="#8aecff">0:42 · 1280×720 · 30 fps</text>
  </g>

  <!-- transport -->
  <g>
    <rect x="0" y="404" width="1200" height="44" fill="#081020" fill-opacity="0.65"/>
    <line x1="0" y1="404" x2="1200" y2="404" stroke="#78d2ff" stroke-opacity="0.22"/>
    <rect x="24" y="416" width="30" height="22" fill="none" stroke="#283448"/><text x="31" y="431" font-size="12" fill="#bcd2ec">⏮</text>
    <rect x="62" y="414" width="42" height="26" fill="#e8f0ff"/><text x="76" y="431" font-size="12" fill="#05070c" font-weight="700">▶</text>
    <text x="120" y="431" font-size="12" fill="#8aecff">0:12</text>
    <rect x="164" y="425" width="946" height="5" fill="#2fd8ff" fill-opacity="0.16"/>
    <rect x="164" y="425" width="248" height="5" fill="#2fd8ff"/>
    <circle cx="412" cy="427.5" r="6" fill="#eaffff" stroke="#2fd8ff" stroke-opacity="0.4" stroke-width="3"/>
    <text x="1128" y="431" font-size="12" fill="#607692">0:42</text>
  </g>

  <!-- timeline -->
  <g>
    <!-- gutter -->
    <rect x="0" y="448" width="76" height="272" fill="#070f22" fill-opacity="0.7"/>
    <line x1="76" y1="448" x2="76" y2="720" stroke="#78d2ff" stroke-opacity="0.22"/>
    <text x="14" y="512" font-size="10.5" fill="#8aecff" letter-spacing="1.5">VIDEO</text>
    <text x="14" y="618" font-size="10.5" fill="#8aecff" letter-spacing="1.5">AUDIO</text>

    <!-- ruler -->
    <rect x="76" y="448" width="1124" height="24" fill="#0a1322" fill-opacity="0.5"/>
    <g font-size="10" fill="#607692">
      <text x="86" y="464">0s</text><text x="266" y="464">5</text><text x="446" y="464">10</text>
      <text x="626" y="464">15</text><text x="806" y="464">20</text><text x="986" y="464">25</text><text x="1146" y="464">30</text>
    </g>

    <!-- video track: frames -->
    <rect x="76" y="472" width="1124" height="90" fill="#0c1626"/>
    <g>
      <rect x="80" y="472" width="58" height="90" fill="url(#frame)"/>
      <rect x="140" y="472" width="58" height="90" fill="url(#frame)"/>
      <rect x="200" y="472" width="58" height="90" fill="url(#frame)"/>
      <rect x="260" y="472" width="58" height="90" fill="url(#frame)"/>
      <rect x="320" y="472" width="58" height="90" fill="url(#frame)"/>
      <rect x="560" y="472" width="58" height="90" fill="url(#frame)"/>
      <rect x="620" y="472" width="58" height="90" fill="url(#frame)"/>
      <rect x="680" y="472" width="58" height="90" fill="url(#frame)"/>
      <rect x="740" y="472" width="58" height="90" fill="url(#frame)"/>
      <rect x="800" y="472" width="58" height="90" fill="url(#frame)"/>
      <rect x="860" y="472" width="58" height="90" fill="url(#frame)"/>
      <rect x="920" y="472" width="58" height="90" fill="url(#frame)"/>
      <rect x="980" y="472" width="58" height="90" fill="url(#frame)"/>
      <rect x="1040" y="472" width="58" height="90" fill="url(#frame)"/>
      <rect x="1100" y="472" width="58" height="90" fill="url(#frame)"/>
    </g>
    <!-- cut (red zone) -->
    <rect x="380" y="472" width="180" height="90" fill="#ff5566" fill-opacity="0.28" stroke="#ff5566" stroke-width="2"/>
    <rect x="380" y="472" width="180" height="90" fill="url(#hatch)"/>
    <pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="6" height="12" fill="#ff5566" fill-opacity="0.15"/>
    </pattern>
    <rect x="542" y="474" width="16" height="16" fill="#ff5566"/><text x="546" y="486" font-size="11" fill="#fff">×</text>

    <!-- audio track: teal clips -->
    <rect x="76" y="562" width="1124" height="64" fill="#060c1a"/>
    <g>
      <rect x="82" y="568" width="150" height="52" fill="url(#clip)" stroke="#19e3c2" rx="0"/>
      <text x="92" y="598" font-size="11" fill="#04110f" font-weight="600">0.mp3</text>
      <rect x="250" y="568" width="120" height="52" fill="url(#clip)" stroke="#19e3c2"/>
      <text x="260" y="598" font-size="11" fill="#04110f" font-weight="600">1.mp3</text>
      <rect x="600" y="568" width="180" height="52" fill="url(#clip)" stroke="#19e3c2"/>
      <text x="610" y="598" font-size="11" fill="#04110f" font-weight="600">2.mp3</text>
      <rect x="800" y="568" width="140" height="52" fill="url(#clip)" stroke="#19e3c2"/>
      <text x="810" y="598" font-size="11" fill="#04110f" font-weight="600">3.mp3</text>
    </g>

    <!-- playhead -->
    <line x1="316" y1="448" x2="316" y2="626" stroke="#2fd8ff" stroke-width="2"/>
    <path d="M310 448 L322 448 L316 458 Z" fill="#2fd8ff"/>
  </g>

  <!-- bottom panel -->
  <rect x="0" y="626" width="1200" height="94" fill="#0a1322" fill-opacity="0.6"/>
  <line x1="0" y1="626" x2="1200" y2="626" stroke="#78d2ff" stroke-opacity="0.22"/>
  <g font-size="12">
    <text x="24" y="678" fill="#8497b8">Audio clips: <tspan fill="#8aecff" font-weight="700">4</tspan></text>
    <rect x="200" y="662" width="220" height="30" fill="none" stroke="#283448"/><text x="216" y="682" fill="#bcd2ec">📋 Voiceover plan for Claude</text>
    <rect x="436" y="662" width="150" height="30" fill="none" stroke="#283448"/><text x="452" y="682" fill="#bcd2ec">📥 Import voiceover</text>
    <rect x="602" y="662" width="130" height="30" fill="#2fd8ff"/><text x="622" y="682" fill="#05070c" font-weight="700">Export mp4</text>
    <rect x="748" y="662" width="180" height="30" fill="#1f7a44"/><text x="764" y="682" fill="#ffffff">⬇ Download montage.mp4</text>
  </g>
</svg>
